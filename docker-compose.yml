version: '3.8'

services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: proyecto_db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: proyectouser
      POSTGRES_PASSWORD: proyectopassword
      POSTGRES_DB: proyectodb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    restart: unless-stopped

  # Central API
  api:
    build:
      context: ./fastapi
    container_name: proyecto_api
    ports:
      - "8001:8000"
    volumes:
      - ./fastapi:/app
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://proyectouser:proyectopassword@db:5432/proyectodb
    restart: unless-stopped

  # App Laravel (Para Clientes Externos)
  laravel:
    build:
      context: ./laravel
    container_name: proyecto_laravel
    ports:
      - "8000:8000"
    volumes:
      - ./laravel:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    depends_on:
      - api
    restart: unless-stopped

  # App Flask (Para Personal Interno)
  flask:
    build:
      context: ./flask
    container_name: proyecto_flask
    ports:
      - "5000:5000"
    volumes:
      - ./flask:/app
    depends_on:
      - db
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - API_URL=http://api:8000
    restart: unless-stopped

volumes:
  postgres_data:
